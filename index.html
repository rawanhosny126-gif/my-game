<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>مغامرة في مدينة الأرقام</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}

<div class="mas"></div><h1>مغامرة في مدينة الأرقام</h1><p class="sub">Number City Adventure</p>

<script>
const $=s=>document.querySelector(s),AR="٠١٢٣٤٥٦٧٨٩",BAL=["","بالونة واحدة","بالونتان","ثلاث بالونات","أربع بالونات","خمس بالونات"];

const MAS='<svg viewBox="0 0 100 110"><defs><radialGradient id="mg" cx=".35" cy=".3"><stop offset="0" stop-color="#b5ecff"/><stop offset="1" stop-color="#2a9df4"/></radialGradient></defs><ellipse cx="50" cy="104" rx="28" ry="5" fill="#0003"/><line x1="50" y1="20" x2="50" y2="8" stroke="#2a9df4" stroke-width="4"/><circle cx="50" cy="7" r="6" fill="#ffd54a"/><circle cx="50" cy="60" r="42" fill="url(#mg)"/><circle cx="36" cy="54" r="10" fill="#fff"/><circle cx="64" cy="54" r="10" fill="#fff"/><circle cx="38" cy="56" r="5" fill="#222"/><circle cx="66" cy="56" r="5" fill="#222"/><path d="M34 72q16 16 32 0" stroke="#222" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="24" cy="70" r="6" fill="#ff8aa8" opacity=".7"/><circle cx="76" cy="70" r="6" fill="#ff8aa8" opacity=".7"/></svg>';
let S=load(),sound=true,lv=0,ti=0,first=0,mist=0,locked=false,cur="",ord=[],ac,tmr;
function load(){const d={unlocked:1,stars:[0,0,0,0,0],name:""};try{return Object.assign(d,JSON.parse(localStorage.getItem("nca")||"{}"))}catch(e){return d}}
function save(){try{localStorage.setItem("nca",JSON.stringify(S))}catch(e){}}
function speak(t){if(!sound||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";u.rate=.85;u.pitch=1.2;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("ar"));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function tone(fs){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.12;o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.22)})}catch(e){}}
const ar=n=>String(n).replace(/\d/g,d=>AR[d]);
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function opts(c,n,lo,hi){const s=new Set([c]);while(s.size<n)s.add(lo+Math.floor(Math.random()*(hi-lo+1)));return shuf([...s])}
function mk(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}

function fx(e){for(let i=0;i<26;i++){const s=mk("span","",e||"⭐");s.style.left=Math.random()*100+"%";s.style.animationDelay=Math.random()*.6+"s";$("#fx").append(s);setTimeout(()=>s.remove(),3000)}}
function correct(){tone([523,659,784]);if(!mist)first++;$("#hud").textContent="⭐ "+AR[first];fx();fb("أحسنت!");setTimeout(()=>{ti++;ti>=5?finish():task()},1700)}
function wrong(h){mist++;tone([260,220]);fb("حاول مرة أخرى، أنت تستطيع!");if(mist>=2&&h)h.classList.add("hint")}
function choices(st,c,list,render){const box=mk("div","choices");list.forEach(v=>{const b=mk("button","num",render(v));b.onclick=()=>{if(locked)return;if(v===c){locked=true;b.classList.add("ok");correct()}else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),500);wrong(box.children[list.indexOf(c)])}};box.append(b)});st.append(box)}
function drag(el,drop){el.addEventListener("pointerdown",e=>{if(el.dataset.done||locked)return;e.preventDefault();const x0=e.clientX,y0=e.clientY;el.classList.add("drg");el.style.pointerEvents="none";
const mv=e=>{el.style.transform=`translate(${e.clientX-x0}px,${e.clientY-y0}px)`},up=e=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);const t=document.elementFromPoint(e.clientX,e.clientY),d=t&&t.closest(".drop");el.style.pointerEvents="";el.classList.remove("drg");if(!(d&&drop(el,d)))el.style.transform=""};
addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",up)})}
const L=[
st=>{const n=ord[ti];q("أين الرقم "+["","واحد","اثنان","ثلاثة","أربعة","خمسة"][n]+"؟");st.append(mk("div","items","<span>🌷</span><span>🌸</span><span>🌼</span><span>🌻</span>"));choices(st,n,opts(n,3,1,5),v=>AR[v])},
st=>{const n=ord[ti],k=[["🍎","تفاحة"],["🍌","موزة"],["🍓","فراولة"],["🧸","دبًّا"],["⚽","كرة"]][ti];q("كم "+k[1]+" نرى؟");st.append(mk("div","items",(`<span>${k[0]}</span>`).repeat(n)));choices(st,n,opts(n,4,1,5),v=>AR[v])},
st=>{const set=[[1,2,3],[2,3,4],[3,4,5],[1,3,5],[1,2,3,4,5]][ti],srt=[...set].sort((a,b)=>a-b);q("رتّب الأرقام في العربات، من الأصغر إلى الأكبر");
const tr=mk("div","train",'<div class="loco">🚂</div>');srt.forEach(v=>{const s=mk("div","drop");s.dataset.v=v;tr.append(s)});const pool=mk("div","pool");let left=set.length;
shuf(set).forEach(v=>{const t=mk("div","tile n"+v,AR[v]);t.dataset.v=v;drag(t,(el,d)=>{if(d.querySelector(".tile"))return false;if(d.dataset.v===el.dataset.v){d.append(el);el.style.transform="";el.dataset.done=1;tone([600]);if(!--left){locked=true;correct()}return true}
wrong(tr.querySelector(`[data-v="${el.dataset.v}"]`));fb("ابحث عن الرقم الأصغر أولًا");return false});pool.append(t)});st.append(tr,pool)},
st=>{const ns=shuf([1,2,3,4,5]).slice(0,3),em=["⚽","⭐","🎈"];q("اسحب المجموعة إلى الباب الذي يحمل الرقم نفسه");const doors=mk("div","doors"),pool=mk("div","pool");let left=3;
ns.forEach(n=>{const d=mk("div","drop door","<b>"+AR[n]+"</b>");d.dataset.v=n;doors.append(d)});
shuf(ns).forEach(n=>{const g=mk("div","tile grp",em[ns.indexOf(n)].repeat(n));g.dataset.v=n;drag(g,(el,d)=>{if(d.querySelector(".tile"))return false;if(d.dataset.v===el.dataset.v){d.append(el);el.style.transform="";el.dataset.done=1;tone([600]);if(!--left){locked=true;correct()}return true}
wrong(doors.querySelector(`[data-v="${el.dataset.v}"]`));return false});pool.append(g)});st.append(doors,pool)},
st=>{const[a,b]=ord[ti],s=a+b;q(`كان معنا ${BAL[a]}، ثم حصلنا على ${BAL[b]}، كم أصبح لدينا؟`);const B="<span>🎈</span>";st.append(mk("div","pl",B.repeat(a)+" ➕ "+B.repeat(b)));choices(st,s,opts(s,3,2,5),v=>AR[v])}];
function task(){mist=0;locked=false;const st=$("#stage");st.innerHTML="";L[lv](st)}
function startLevel(i){lv=i;ti=0;first=0;ord=i==4?shuf([[2,3],[1,1],[3,1],[1,3],[2,2]]):shuf([1,2,3,4,5]);$("#lname").textContent=NAMES[i];$("#hud").textContent="⭐ ٠";show("sc-play",i+1);task()}
function finish(){const s=first>=4?3:first>=2?2:1;S.stars[lv]=Math.max(S.stars[lv],s);S.unlocked=Math.max(S.unlocked,Math.min(5,lv+2));save();show("sc-win",lv+1);
$("#wstars").textContent="⭐".repeat(s)+"☆".repeat(3-s);$("#wtxt").textContent="حصلت على "+AR[s]+" نجوم";$("#b-next").textContent=lv<4?"المستوى التالي":"إلى النهاية";tone([523,659,784,1047]);fx();speak("أحسنت يا بطل!")}
